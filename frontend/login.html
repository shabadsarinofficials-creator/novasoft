<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · BizSuite</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="logo">
        <h1>BizSuite</h1>
        <p>by NovaSoft · Business Management</p>
      </div>
      <div id="loginError" class="login-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input class="form-control" type="text" id="email" inputmode="email" required autocomplete="username" placeholder="you@company.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem" id="loginBtn">
          Sign in
        </button>
      </form>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    if (API.getToken()) window.location.href = "/dashboard";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");
      err.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        await API.login(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.href = "/dashboard";
      } catch (ex) {
        err.textContent = ex.message || "Login failed";
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
