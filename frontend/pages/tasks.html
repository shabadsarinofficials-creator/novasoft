<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasks · BizSuite</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><h1>BizSuite</h1><span>NovaSoft</span></div>
      <nav class="sidebar-nav">
        <a href="/dashboard"><span class="nav-icon">▣</span> Dashboard</a>
        <a href="/pages/tasks.html" class="active"><span class="nav-icon">☑</span> Tasks</a>
        <a href="/pages/projects.html"><span class="nav-icon">◈</span> Projects</a>
        <a href="/pages/team.html"><span class="nav-icon">👤</span> Team</a>
        <a href="/pages/announcements.html"><span class="nav-icon">📢</span> Announcements</a>
        <a href="/pages/chat.html"><span class="nav-icon">💬</span> Chat</a>
        <a href="/pages/files.html"><span class="nav-icon">📁</span> Files</a>
        <a href="/pages/settings.html"><span class="nav-icon">⚙</span> Settings</a>
      </nav>
      <div class="sidebar-footer"><button class="btn btn-ghost btn-sm" onclick="API.logout()" style="color:#94a3b8">Sign out</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:0.75rem">
          <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
          <h2>Tasks</h2>
        </div>
        <div class="topbar-actions"><div class="user-chip" id="userChip"></div></div>
      </header>
      <div class="content">
        <div class="toolbar">
          <input class="form-control search-input" id="search" placeholder="Search tasks…" />
          <select class="form-control" id="filterStatus" style="max-width:140px">
            <option value="">All statuses</option>
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="under_review">Under Review</option>
            <option value="completed">Completed</option>
            <option value="blocked">Blocked</option>
          </select>
          <select class="form-control" id="filterPriority" style="max-width:130px">
            <option value="">All priorities</option>
            <option value="low">Low</option>
            <option value="normal">Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-primary" id="btnNew" onclick="openModal()">+ New task</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data">
              <thead>
                <tr><th>Title</th><th>Status</th><th>Priority</th><th>Assignee</th><th>Due</th><th></th></tr>
              </thead>
              <tbody id="taskBody"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">New task</h3>
        <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
      </div>
      <form id="taskForm">
        <div class="modal-body">
          <input type="hidden" id="taskId" />
          <div class="form-group">
            <label>Title</label>
            <input class="form-control" id="title" required />
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" id="description"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Status</label>
              <select class="form-control" id="status">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="under_review">Under Review</option>
                <option value="completed">Completed</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>
            <div class="form-group">
              <label>Priority</label>
              <select class="form-control" id="priority">
                <option value="low">Low</option>
                <option value="normal" selected>Normal</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Due date</label>
              <input class="form-control" type="date" id="due_date" />
            </div>
            <div class="form-group">
              <label>Assignee</label>
              <select class="form-control" id="assignee_id"><option value="">— Unassigned —</option></select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error("auth");
    let users = [];

    async function init() {
      await loadCurrentUser();
      users = await API.get("/api/users?active=true");
      const sel = document.getElementById("assignee_id");
      users.forEach(u => {
        sel.innerHTML += `<option value="${u.id}">${u.name}</option>`;
      });
      const canCreate = window.currentUser?.role !== "employee";
      document.getElementById("btnNew").style.display = canCreate ? "" : "none";
      await loadTasks();
    }

    async function loadTasks() {
      const params = new URLSearchParams();
      const st = document.getElementById("filterStatus").value;
      const pr = document.getElementById("filterPriority").value;
      const q = document.getElementById("search").value.trim();
      if (st) params.set("status", st);
      if (pr) params.set("priority", pr);
      if (q) params.set("q", q);
      try {
        const tasks = await API.get("/api/tasks?" + params.toString());
        const body = document.getElementById("taskBody");
        if (!tasks.length) {
          body.innerHTML = '<tr><td colspan="6" class="empty-state">No tasks found</td></tr>';
          return;
        }
        body.innerHTML = tasks.map(t => `
          <tr>
            <td><strong>${escapeHtml(t.title)}</strong></td>
            <td>${statusBadge(t.status)}</td>
            <td>${priorityBadge(t.priority)}</td>
            <td>${t.assignee?.name || "—"}</td>
            <td>${formatDate(t.due_date)}</td>
            <td><button class="btn btn-sm btn-secondary" onclick='editTask(${JSON.stringify(t).replace(/'/g, "&#39;")})'>Edit</button></td>
          </tr>
        `).join("");
      } catch (e) {
        toast(e.message, "error");
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function openModal(task = null) {
      document.getElementById("modal").classList.add("open");
      document.getElementById("modalTitle").textContent = task ? "Edit task" : "New task";
      document.getElementById("taskId").value = task?.id || "";
      document.getElementById("title").value = task?.title || "";
      document.getElementById("description").value = task?.description || "";
      document.getElementById("status").value = task?.status || "todo";
      document.getElementById("priority").value = task?.priority || "normal";
      document.getElementById("due_date").value = task?.due_date || "";
      document.getElementById("assignee_id").value = task?.assignee_id || "";
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("open");
    }

    function editTask(t) { openModal(t); }

    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("taskId").value;
      const payload = {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim() || null,
        status: document.getElementById("status").value,
        priority: document.getElementById("priority").value,
        due_date: document.getElementById("due_date").value || null,
        assignee_id: document.getElementById("assignee_id").value
          ? parseInt(document.getElementById("assignee_id").value) : null,
      };
      try {
        if (id) await API.patch(`/api/tasks/${id}`, payload);
        else await API.post("/api/tasks", payload);
        closeModal();
        toast(id ? "Task updated" : "Task created", "success");
        loadTasks();
      } catch (ex) {
        toast(ex.message, "error");
      }
    });

    document.getElementById("filterStatus").addEventListener("change", loadTasks);
    document.getElementById("filterPriority").addEventListener("change", loadTasks);
    document.getElementById("search").addEventListener("input", () => {
      clearTimeout(window._st);
      window._st = setTimeout(loadTasks, 300);
    });

    init();
  </script>
</body>
</html>
