<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat · BizSuite</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><h1>BizSuite</h1><span>NovaSoft</span></div>
      <nav class="sidebar-nav">
        <a href="/dashboard"><span class="nav-icon">▣</span> Dashboard</a>
        <a href="/pages/tasks.html"><span class="nav-icon">☑</span> Tasks</a>
        <a href="/pages/projects.html"><span class="nav-icon">◈</span> Projects</a>
        <a href="/pages/team.html"><span class="nav-icon">👤</span> Team</a>
        <a href="/pages/announcements.html"><span class="nav-icon">📢</span> Announcements</a>
        <a href="/pages/chat.html" class="active"><span class="nav-icon">💬</span> Chat</a>
        <a href="/pages/files.html"><span class="nav-icon">📁</span> Files</a>
        <a href="/pages/settings.html"><span class="nav-icon">⚙</span> Settings</a>
      </nav>
      <div class="sidebar-footer"><button class="btn btn-ghost btn-sm" onclick="API.logout()" style="color:#94a3b8">Sign out</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:0.75rem">
          <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
          <h2>Internal Chat</h2>
        </div>
        <div class="topbar-actions"><div class="user-chip" id="userChip"></div></div>
      </header>
      <div class="content">
        <div class="toolbar">
          <select class="form-control" id="newUser" style="max-width:220px"><option value="">Start chat with…</option></select>
          <button class="btn btn-primary btn-sm" onclick="startChat()">Start</button>
        </div>
        <div class="chat-layout">
          <div class="chat-list" id="convList"><div class="empty-state">No conversations</div></div>
          <div class="chat-messages">
            <div class="chat-messages-body" id="msgBody"><div class="empty-state">Select a conversation</div></div>
            <div class="chat-input-row" id="inputRow" style="display:none">
              <input class="form-control" id="msgInput" placeholder="Type a message…" />
              <button class="btn btn-primary" onclick="sendMsg()">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error("auth");
    let activeConv = null;
    let pollTimer = null;

    async function init() {
      await loadCurrentUser();
      const users = await API.get("/api/users?active=true");
      const sel = document.getElementById("newUser");
      users.filter(u => u.id !== window.currentUser.id).forEach(u => {
        sel.innerHTML += `<option value="${u.id}">${u.name}</option>`;
      });
      await loadConvs();
      // Polling fallback
      pollTimer = setInterval(() => { if (activeConv) loadMessages(activeConv, true); loadConvs(true); }, 5000);
    }

    async function loadConvs(silent) {
      try {
        const list = await API.get("/api/chat/conversations");
        const el = document.getElementById("convList");
        if (!list.length) { if (!silent) el.innerHTML = '<div class="empty-state">No conversations</div>'; return; }
        el.innerHTML = list.map(c => {
          const title = c.is_group ? (c.title || "Group") :
            (c.members?.find(m => m.id !== window.currentUser.id)?.name || "Chat");
          return `<div class="chat-list-item ${activeConv === c.id ? "active" : ""}" onclick="openConv(${c.id})">
            <div class="title">${title}${c.unread_count ? ` (${c.unread_count})` : ""}</div>
            <div class="preview">${c.last_message?.body || "No messages yet"}</div>
          </div>`;
        }).join("");
      } catch (e) { if (!silent) toast(e.message, "error"); }
    }

    async function openConv(id) {
      activeConv = id;
      document.getElementById("inputRow").style.display = "flex";
      await loadMessages(id);
      loadConvs(true);
    }

    async function loadMessages(id, silent) {
      try {
        const msgs = await API.get(`/api/chat/conversations/${id}/messages`);
        const el = document.getElementById("msgBody");
        el.innerHTML = msgs.map(m => {
          const mine = m.sender_id === window.currentUser.id;
          return `<div class="msg ${mine ? "mine" : ""}">
            <div class="bubble">${escapeHtml(m.body)}</div>
            <div class="meta">${m.sender?.name || ""} · ${formatDateTime(m.created_at)}</div>
          </div>`;
        }).join("") || '<div class="empty-state">No messages</div>';
        el.scrollTop = el.scrollHeight;
      } catch (e) { if (!silent) toast(e.message, "error"); }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function startChat() {
      const uid = document.getElementById("newUser").value;
      if (!uid) return;
      try {
        const conv = await API.post("/api/chat/conversations", {
          is_group: false,
          member_ids: [parseInt(uid)],
        });
        await loadConvs();
        openConv(conv.id);
      } catch (e) { toast(e.message, "error"); }
    }

    async function sendMsg() {
      const input = document.getElementById("msgInput");
      const body = input.value.trim();
      if (!body || !activeConv) return;
      try {
        await API.post(`/api/chat/conversations/${activeConv}/messages`, { body });
        input.value = "";
        await loadMessages(activeConv);
        loadConvs(true);
      } catch (e) { toast(e.message, "error"); }
    }

    document.getElementById("msgInput")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMsg();
    });

    init();
  </script>
</body>
</html>
