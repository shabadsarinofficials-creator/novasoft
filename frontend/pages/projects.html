<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects · BizSuite</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><h1>BizSuite</h1><span>NovaSoft</span></div>
      <nav class="sidebar-nav">
        <a href="/dashboard"><span class="nav-icon">▣</span> Dashboard</a>
        <a href="/pages/tasks.html"><span class="nav-icon">☑</span> Tasks</a>
        <a href="/pages/projects.html" class="active"><span class="nav-icon">◈</span> Projects</a>
        <a href="/pages/team.html"><span class="nav-icon">👤</span> Team</a>
        <a href="/pages/announcements.html"><span class="nav-icon">📢</span> Announcements</a>
        <a href="/pages/chat.html"><span class="nav-icon">💬</span> Chat</a>
        <a href="/pages/files.html"><span class="nav-icon">📁</span> Files</a>
        <a href="/pages/settings.html"><span class="nav-icon">⚙</span> Settings</a>
      </nav>
      <div class="sidebar-footer"><button class="btn btn-ghost btn-sm" onclick="API.logout()" style="color:#94a3b8">Sign out</button></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:0.75rem">
          <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
          <h2>Projects</h2>
        </div>
        <div class="topbar-actions"><div class="user-chip" id="userChip"></div></div>
      </header>
      <div class="content">
        <div class="toolbar">
          <input class="form-control search-input" id="search" placeholder="Search projects…" />
          <div class="spacer"></div>
          <button class="btn btn-primary" id="btnNew" onclick="openModal()">+ New project</button>
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Name</th><th>Status</th><th>Manager</th><th>Dates</th><th>Members</th><th></th></tr></thead>
              <tbody id="body"><tr><td colspan="6" class="loading">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-header"><h3 id="modalTitle">New project</h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div>
      <form id="form">
        <div class="modal-body">
          <input type="hidden" id="projId" />
          <div class="form-group"><label>Name</label><input class="form-control" id="name" required /></div>
          <div class="form-group"><label>Description</label><textarea class="form-control" id="description"></textarea></div>
          <div class="form-row">
            <div class="form-group">
              <label>Status</label>
              <select class="form-control" id="status">
                <option value="planning">Planning</option>
                <option value="active">Active</option>
                <option value="on_hold">On Hold</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="form-group">
              <label>Manager</label>
              <select class="form-control" id="manager_id"><option value="">—</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Start</label><input type="date" class="form-control" id="start_date" /></div>
            <div class="form-group"><label>End</label><input type="date" class="form-control" id="end_date" /></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error("auth");
    async function init() {
      await loadCurrentUser();
      const users = await API.get("/api/users?active=true");
      const sel = document.getElementById("manager_id");
      users.filter(u => u.role !== "employee").forEach(u => {
        sel.innerHTML += `<option value="${u.id}">${u.name}</option>`;
      });
      if (window.currentUser?.role === "employee") document.getElementById("btnNew").style.display = "none";
      load();
    }
    async function load() {
      const q = document.getElementById("search").value.trim();
      try {
        const list = await API.get("/api/projects" + (q ? "?q=" + encodeURIComponent(q) : ""));
        const body = document.getElementById("body");
        if (!list.length) { body.innerHTML = '<tr><td colspan="6" class="empty-state">No projects</td></tr>'; return; }
        body.innerHTML = list.map(p => `
          <tr>
            <td><strong>${p.name}</strong></td>
            <td>${statusBadge(p.status)}</td>
            <td>${p.manager?.name || "—"}</td>
            <td>${formatDate(p.start_date)} – ${formatDate(p.end_date)}</td>
            <td>${p.members?.length || 0}</td>
            <td><button class="btn btn-sm btn-secondary" onclick='edit(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button></td>
          </tr>
        `).join("");
      } catch (e) { toast(e.message, "error"); }
    }
    function openModal(p) {
      document.getElementById("modal").classList.add("open");
      document.getElementById("modalTitle").textContent = p ? "Edit project" : "New project";
      document.getElementById("projId").value = p?.id || "";
      document.getElementById("name").value = p?.name || "";
      document.getElementById("description").value = p?.description || "";
      document.getElementById("status").value = p?.status || "planning";
      document.getElementById("manager_id").value = p?.manager_id || "";
      document.getElementById("start_date").value = p?.start_date || "";
      document.getElementById("end_date").value = p?.end_date || "";
    }
    function closeModal() { document.getElementById("modal").classList.remove("open"); }
    function edit(p) { openModal(p); }
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("projId").value;
      const payload = {
        name: document.getElementById("name").value.trim(),
        description: document.getElementById("description").value.trim() || null,
        status: document.getElementById("status").value,
        manager_id: document.getElementById("manager_id").value ? parseInt(document.getElementById("manager_id").value) : null,
        start_date: document.getElementById("start_date").value || null,
        end_date: document.getElementById("end_date").value || null,
      };
      try {
        if (id) await API.patch(`/api/projects/${id}`, payload);
        else await API.post("/api/projects", payload);
        closeModal(); toast("Saved", "success"); load();
      } catch (ex) { toast(ex.message, "error"); }
    });
    document.getElementById("search").addEventListener("input", () => { clearTimeout(window._t); window._t = setTimeout(load, 300); });
    init();
  </script>
</body>
</html>
