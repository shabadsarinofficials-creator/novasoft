{% extends "base.html" %}
{% block title %}Admin sign in — NovaSoft{% endblock %}
{% block content %}
<section class="login-wrap"><div class="login-card">
  <div class="login-mark">N</div><div class="eyebrow">PRIVATE ACCESS</div><h1>Welcome back.</h1><p>Sign in to manage your digital store.</p>
  <form method="post" class="admin-form">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary btn-wide" type="submit">Sign in securely ↗</button>
  </form><a class="back-link" href="{{ url_for('home') }}">← Back to storefront</a>
</div></section>
{% endblock %}
