<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizSuite Employee</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#172233;--muted:#65738a;--line:#e0e6ef;--accent:#4355d9;--accent2:#e9ecff;--red:#b42318;--green:#16804a;--amber:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:9px 13px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}button:hover{filter:brightness(1.06)}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eef1f7;color:var(--ink)}.danger{background:#fff0ee;color:var(--red)}.success{background:#e5f7ed;color:#087443}input,select,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:9px;padding:10px;color:var(--ink)}textarea{min-height:90px;resize:vertical}label{display:block;font-weight:650;margin:10px 0 5px}.hidden,[hidden]{display:none!important}.layout{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}.side{background:#151d32;color:#e9edff;padding:22px 14px;display:flex;flex-direction:column;gap:7px}.brand{font-size:20px;font-weight:800;padding:0 10px 5px}.subbrand{color:#9aa7c7;font-size:11px;padding:0 10px 15px;letter-spacing:.12em}.nav{background:transparent;color:#d4dbf2;text-align:left;display:flex;gap:10px;align-items:center;width:100%}.nav.active,.nav:hover{background:#2b3657;color:white}.sidefoot{margin-top:auto;color:#aab4d0;padding:10px;font-size:12px}.main{padding:26px;min-width:0;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}.h1{font-size:28px;letter-spacing:-.04em;margin:3px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stats,.panel,.task{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.stats .num{font-size:27px;font-weight:800;letter-spacing:-.04em}.stats .label{color:var(--muted);font-size:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.sectionhead h2{font-size:17px;margin:0}.columns{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:14px}.tasklist{display:grid;gap:12px}.taskfilters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(3,minmax(120px,1fr));gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin:12px 0 16px}.taskkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}.taskkpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.taskkpi b{display:block;font-size:22px}.taskkpi span{color:var(--muted);font-size:12px}.due-over{color:var(--red);font-weight:800}.due-soon{color:var(--amber);font-weight:800}.commentbox,.historybox,.versionbox{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.commentitem,.historyitem,.versionitem{padding:9px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.commentitem:last-child,.historyitem:last-child,.versionitem:last-child{border-bottom:0}.commentform{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.commentform textarea{min-height:44px}.task h3{margin:0 0 5px;font-size:16px}.tasktop{display:flex;justify-content:space-between;gap:12px;align-items:start}.pill{display:inline-block;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;background:#edf0f5;color:#465268;white-space:nowrap}.pill.critical,.pill.high{background:#fff0e6;color:#a34700}.pill.submitted,.pill.approved{background:#e3f8ed;color:#087443}.pill.delayed,.pill.needs_changes{background:#fff0ee;color:#b42318}.pill.in_progress{background:#e9ecff;color:#3445bd}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;color:var(--muted);font-size:12px}.task p{white-space:pre-wrap;overflow-wrap:anywhere}.taskactions{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:12px}.taskactions>*{flex:1;min-width:125px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.message{border-bottom:1px solid var(--line);padding:12px 0}.message:last-child{border:0}.message h4{margin:0 0 3px}.message p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.notice{border-radius:10px;padding:12px;background:#f0f2ff;color:#2e3ea8;margin-bottom:16px}.error{color:var(--red);margin-top:8px}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #ccd4e2;border-radius:12px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);padding:30px;background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 80px #18234a12}.login h1{margin:0;font-size:27px}.login p{color:var(--muted)}.login label{margin-top:15px}.login button{width:100%;margin-top:18px}.tiny{font-size:12px;color:var(--muted)}.taskurl{color:var(--accent);overflow-wrap:anywhere}.toast{position:fixed;bottom:20px;right:20px;background:#182238;color:white;padding:12px 18px;border-radius:10px;display:none;max-width:min(440px,calc(100vw - 40px));z-index:10;box-shadow:0 10px 40px #0002}.toast.show{display:block}.fileinput{font-size:12px}.unread{border-left:4px solid var(--accent);padding-left:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.smallbtn{padding:6px 9px;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{width:auto}.event{padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:white}.event b{display:block}
@media(max-width:950px){.layout{grid-template-columns:1fr}.side{position:static;flex-direction:row;overflow:auto;align-items:center;padding:10px}.brand{white-space:nowrap}.subbrand,.sidefoot{display:none}.nav{white-space:nowrap;width:auto;flex:0 0 auto}.main{padding:16px}.columns{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.taskfilters,.taskkpis{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}.h1{font-size:23px}}@media(max-width:480px){.taskfilters,.taskkpis,.grid{grid-template-columns:1fr}.main{padding:12px}.taskactions>*{min-width:100%}}
</style></head><body>
<div id="login" class="loginwrap"><form id="loginForm" class="login"><div class="eyebrow">Company workspace</div><h1>BizSuite</h1><p>Sign in to see your work, team tasks, and company updates.</p><label>Work email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div id="loginError" class="error" role="alert"></div><button id="loginBtn" type="submit">Sign in</button><p class="tiny">Use your Employee account to view assigned tasks and submit your work.</p></form></div>
<div id="layout" class="layout" hidden><aside class="side"><div><div class="brand">◈ BizSuite</div><div class="subbrand" id="roleLabel">WORKSPACE</div></div><button class="nav active" data-view="home">⌂ Overview</button><button class="nav" data-view="tasks">▤ <span id="taskNav">My tasks</span></button><button class="nav" data-view="messages">✉ Messages</button><button class="nav" data-view="notifications">♧ Notifications <span id="unreadCount"></span></button><button class="nav" data-view="calendar">▦ Calendar</button><button class="nav" data-view="reports">▥ Reports</button><button class="nav managerOnly" data-view="team" hidden>♙ Team</button><button class="nav managerOnly" data-view="create" hidden>＋ Assign work</button><div class="sidefoot"><div id="userName"></div><div id="userRole"></div><button class="nav" id="logout" type="button">↪ Sign out</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow" id="dateLabel">YOUR WORKSPACE</div><h1 class="h1" id="pageTitle">Overview</h1><div class="muted" id="pageSubtitle">A clear view of what's happening.</div></div><div class="toolbar"><button class="secondary" id="searchBtn" type="button">Search</button><button class="secondary" id="refresh" type="button">↻ Refresh</button></div></div><div id="content"></div></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const API=window.bizsuiteConfig?.apiBase||localStorage.getItem('api')||'http://127.0.0.1:8000';let token=sessionStorage.getItem('t')||'',me={name:sessionStorage.getItem('n')||'',role:sessionStorage.getItem('role')||''},people=[],tasks=[],messages=[],notifications=[],view='home',query='',calendarItems=[],reports={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isManager=()=>me.role==='manager';const body=(method,data)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const toast=s=>{const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),4000)};const dateText=s=>s?String(s).replace('T',' ').slice(0,16):'No deadline';const pill=s=>`<span class="pill ${esc(s)}">${esc(String(s||'').replaceAll('_',' '))}</span>`;const fileSizeOk=f=>f&&f.size<=50*1024*1024;
async function api(path,opt={}){const headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body&&! (opt.body instanceof FormData)&&!headers['Content-Type'])headers['Content-Type']='application/json';let r;try{r=await fetch(API+path,{...opt,headers})}catch(e){throw Error('Cannot reach the company server. Open File → Configure server connection and check that the shared server is running.')}const ct=r.headers.get('content-type')||'';let data=ct.includes('json')?await r.json().catch(()=>({})):null;if(!r.ok){if(r.status===401){logout(false)}throw Error(typeof data?.detail==='string'?data.detail:`Request failed (${r.status})`)}return data}
async function loginSubmit(e){e.preventDefault();$('loginBtn').disabled=true;$('loginError').textContent='';try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Sign in failed');if(j.role!=='employee')throw Error('This app is for Employee accounts. Use BizSuite Manager for manager accounts.');token=j.token;me={name:j.name,role:j.role};sessionStorage.setItem('t',token);sessionStorage.setItem('n',me.name);sessionStorage.setItem('role',me.role);await boot()}catch(e){$('loginError').textContent=e.message||'Sign in failed'}finally{$('loginBtn').disabled=false}}
function logout(showToast=true){token='';me={name:'',role:''};sessionStorage.removeItem('t');sessionStorage.removeItem('n');sessionStorage.removeItem('role');$('layout').hidden=true;$('login').hidden=false;if(showToast)toast('Signed out')}
async function loadAll(){const results=await Promise.all([api('/work/tasks'),api('/work/messages'),api('/work/people'),api('/work/notifications'),api('/work/reports'),api('/work/calendar')]);[tasks,messages,people,notifications,reports,calendarItems]=results;$('unreadCount').textContent=notifications.some(n=>!n.read)?'•':''}
async function boot(){if(!token){$('login').hidden=false;$('layout').hidden=true;return}try{await loadAll();$('login').hidden=true;$('layout').hidden=false;$('roleLabel').textContent=me.role.toUpperCase()+' WORKSPACE';$('userName').textContent=me.name;$('userRole').textContent=isManager()?'Team manager':'Employee account';$('taskNav').textContent=isManager()?'Team tasks':'My tasks';document.querySelectorAll('.managerOnly').forEach(x=>x.hidden=!isManager());$('dateLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});render()}catch(e){$('login').hidden=false;$('layout').hidden=true;$('loginError').textContent=e.message}}
function go(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function render(){const meta={home:['Overview','Your work, deadlines, and company updates.'],tasks:[isManager()?'Team tasks':'My tasks','Track priorities, progress, submissions, and discussions.'],messages:['Messages & meetings','Direct messages, team announcements, meeting notices, and acknowledgements.'],notifications:['Notifications','Updates about tasks, comments, reviews, and messages.'],calendar:['Calendar','Upcoming task deadlines and meeting notices.'],reports:['Reports','A live summary of work status and deadlines.'],team:['Team','Manage employee accounts and team access.'],create:['Assign work','Create a clear assignment with an owner, priority, and deadline.'],search:['Search','Search tasks, messages, and—if you are a manager—team members.']};$('pageTitle').textContent=meta[view]?.[0]||'BizSuite';$('pageSubtitle').textContent=meta[view]?.[1]||'';const fn={home:homeView,tasks:tasksView,messages:messagesView,notifications:notificationsView,calendar:calendarView,reports:reportsView,team:teamView,create:createView,search:searchView};if(!fn[view])view='home';if(['team','create'].includes(view)&&!isManager())view='home';try{fn[view]()}catch(e){$('content').innerHTML=`<section class="panel"><b>Could not render this page</b><p class="error">${esc(e.message)}</p><button data-action="refresh">Retry</button></section>`}}
function stat(label,value,detail=''){return `<div class="stats"><div class="num">${value}</div><div class="label">${esc(label)}</div>${detail?`<div class="tiny">${esc(detail)}</div>`:''}</div>`}
function dueInfo(t){if(!t.deadline)return 'No deadline';const d=new Date(t.deadline),now=new Date(),days=(d-now)/86400000;if(Number.isNaN(+d))return t.deadline;if(t.status==='approved')return 'Completed';if(days<0)return 'OVERDUE';if(days<2)return 'Due soon';return dateText(t.deadline)}
function homeView(){const active=tasks.filter(t=>!['approved'].includes(t.status)),overdue=active.filter(t=>dueInfo(t)==='OVERDUE'),review=tasks.filter(t=>t.status==='submitted'),unread=notifications.filter(n=>!n.read);$('content').innerHTML=`<div class="grid">${stat('Total tasks',tasks.length)}${stat('Active tasks',active.length)}${stat('Overdue',overdue.length)}${stat(isManager()?'Awaiting review':'Unread notifications',isManager()?review.length:unread.length)}</div><div class="columns" style="margin-top:16px"><section><div class="sectionhead"><h2>${isManager()?'Priority work':'Your next tasks'}</h2><button class="secondary smallbtn" data-action="go" data-view="tasks">View all</button></div><div class="tasklist">${[...active].sort((a,b)=>({critical:0,high:1,normal:2,low:3}[a.priority]??2)-({critical:0,high:1,normal:2,low:3}[b.priority]??2)).slice(0,5).map(t=>`<div class="task"><div class="tasktop"><div><h3>#${t.id} · ${esc(t.title)}</h3><div class="meta">${isManager()?'Assigned to '+esc(t.assignee_name)+' · ':''}Due ${esc(dateText(t.deadline))}</div></div><div>${pill(t.priority)} ${pill(t.status)}</div></div><p>${esc(t.description||'No instructions provided.')}</p><button class="secondary smallbtn" data-action="go" data-view="tasks">Open Task Center</button></div>`).join('')||'<div class="empty">No tasks assigned yet.</div>'}</div></section><section class="panel"><h2>Recent updates</h2>${unread.slice(0,5).map(n=>`<div class="message ${n.read?'':'unread'}"><h4>${esc(n.title)}</h4><p>${esc(n.body)}</p><div class="tiny">${esc(dateText(n.created))}</div></div>`).join('')||'<div class="empty">You are all caught up.</div>'}<button class="secondary" data-action="go" data-view="notifications">Open notifications</button></section></div>`}
function tasksView(){const q=($('taskSearch')?.value??query).toLowerCase(),status=$('statusFilter')?.value||'',priority=$('priorityFilter')?.value||'';const list=tasks.filter(t=>(!q||[t.title,t.description,t.assignee_name,t.manager_name,String(t.id)].join(' ').toLowerCase().includes(q))&&(!status||t.status===status)&&(!priority||t.priority===priority));$('content').innerHTML=`<div class="taskkpis">${['assigned','in_progress','submitted','approved'].map(s=>`<div class="taskkpi"><b>${tasks.filter(t=>t.status===s).length}</b><span>${esc(s.replaceAll('_',' '))}</span></div>`).join('')}</div><div class="taskfilters"><input id="taskSearch" placeholder="Search tasks, people, ID…" value="${esc(q)}"><select id="statusFilter"><option value="">All statuses</option>${['assigned','in_progress','submitted','needs_changes','approved','delayed'].map(s=>`<option value="${s}" ${status===s?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select><select id="priorityFilter"><option value="">All priorities</option>${['critical','high','normal','low'].map(s=>`<option value="${s}" ${priority===s?'selected':''}>${s}</option>`).join('')}</select>${isManager()?'<button data-action="go" data-view="create">＋ Assign task</button>':'<button class="secondary" data-action="clear-filters">Clear filters</button>'}</div><div class="tasklist">${list.map(taskCard).join('')||'<div class="empty">No tasks match your filters.</div>'}</div>`}
function taskCard(t){const deadline=dueInfo(t),canEmployee=me.role==='employee';return `<article class="task" id="task-${t.id}"><div class="tasktop"><div><h3>#${t.id} · ${esc(t.title)}</h3><div class="meta">${isManager()?`Assigned to <b>${esc(t.assignee_name)}</b> · `:''}Deadline: <span class="${deadline==='OVERDUE'?'due-over':deadline==='Due soon'?'due-soon':''}">${esc(deadline)}</span> · Updated ${esc(dateText(t.updated))}</div></div><div>${pill(t.priority)} ${pill(t.status)}</div></div><p>${esc(t.description||'No instructions provided.')}</p>${t.feedback?`<div class="notice"><b>Manager feedback:</b> ${esc(t.feedback)}</div>`:''}${t.reference_url?`<p>Reference: <a class="taskurl" href="${esc(t.reference_url)}" target="_blank" rel="noopener noreferrer">${esc(t.reference_url)}</a></p>`:''}<div class="toolbar">${t.attachment_name?`<button class="secondary smallbtn" data-action="download-attachment" data-id="${t.id}">Download reference file</button>`:''}${t.submission_name?`<button class="secondary smallbtn" data-action="download-zip" data-id="${t.id}">Download latest ZIP</button>`:''}${t.submission_url?`<a href="${esc(t.submission_url)}" target="_blank" rel="noopener noreferrer">Open latest submission URL</a>`:''}<button class="secondary smallbtn" data-action="toggle-detail" data-id="${t.id}">Discussion & history</button>${isManager()?`<button class="secondary smallbtn" data-action="edit-task" data-id="${t.id}">Edit task</button>`:''}</div><div id="detail-${t.id}" hidden><div class="columns" style="margin-top:12px"><section class="commentbox"><h4>Task discussion</h4><div id="comments-${t.id}"><span class="muted">Open to load comments.</span></div><form class="commentform" data-form="comment" data-id="${t.id}"><textarea name="body" required maxlength="10000" placeholder="Ask a question or add an update…"></textarea><button>Comment</button></form></section><section class="historybox"><h4>Task history</h4><div id="history-${t.id}"><span class="muted">Open to load history.</span></div><h4>Submission versions</h4><div id="versions-${t.id}"><span class="muted">Open to load versions.</span></div></section></div></div>${canEmployee?`<div class="sectionhead"><h4>Update progress / submit work</h4></div><div class="formgrid"><div><label>Status</label><select id="status-${t.id}">${['assigned','in_progress','submitted','needs_changes','approved','delayed'].filter(s=>['assigned','in_progress','submitted','delayed','needs_changes'].includes(s)).map(s=>`<option value="${s}" ${t.status===s?'selected':''} ${['assigned','needs_changes'].includes(s)?'disabled':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div><div><label>Project URL</label><input id="url-${t.id}" type="url" placeholder="https://…" value="${esc(t.submission_url||'')}"></div></div><label>Submission note</label><textarea id="note-${t.id}" placeholder="What did you complete? Any notes for your manager?">${esc(t.submission_note||'')}</textarea><div class="taskactions"><button data-action="save-progress" data-id="${t.id}">Save progress / submit URL</button><div><label class="tiny">Upload project ZIP (max 50 MB)</label><input class="fileinput" id="zip-${t.id}" type="file" accept=".zip,application/zip"></div><button class="secondary" data-action="upload-zip" data-id="${t.id}">Submit ZIP</button></div>`:''}${isManager()?`<div class="sectionhead"><h4>Review submission</h4></div><div class="formgrid"><div><label>Review decision</label><select id="reviewstatus-${t.id}">${['submitted','approved','needs_changes','in_progress','delayed'].map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div><div><label>Feedback to employee</label><input id="feedback-${t.id}" value="${esc(t.feedback||'')}" placeholder="Feedback or requested changes"></div></div><div class="toolbar" style="margin-top:8px"><button data-action="review-task" data-id="${t.id}">Save review</button></div>`:''}</article>`}
async function loadTaskDetails(id){const [comments,hist,versions]=await Promise.all([api(`/work/tasks/${id}/comments`),api(`/work/tasks/${id}/history`),api(`/work/tasks/${id}/submissions`)]);const c=$(`comments-${id}`),h=$(`history-${id}`),v=$(`versions-${id}`);if(c)c.innerHTML=comments.map(x=>`<div class="commentitem"><b>${esc(x.author)}</b> <span class="tiny">${esc(x.author_role)} · ${esc(dateText(x.created))}</span><div>${esc(x.body)}</div></div>`).join('')||'<p class="muted">No comments yet.</p>';if(h)h.innerHTML=hist.map(x=>`<div class="historyitem"><b>${esc(x.action.replaceAll('_',' '))}</b><div>${esc(x.detail)}</div><span class="tiny">${esc(x.actor)} · ${esc(dateText(x.created))}</span></div>`).join('')||'<p class="muted">No history recorded yet.</p>';if(v)v.innerHTML=versions.map(x=>`<div class="versionitem"><b>Version ${x.version}</b> · ${esc(x.file_name||'URL submission')}<div>${esc(x.note||'')}</div>${x.submission_url?`<a href="${esc(x.submission_url)}" target="_blank" rel="noopener noreferrer">Open URL</a>`:''}${x.has_file?` <button class="secondary smallbtn" data-action="download-version" data-id="${id}" data-version="${x.id}">Download ZIP</button>`:''}<div class="tiny">${esc(x.user)} · ${esc(dateText(x.created))}</div></div>`).join('')||'<p class="muted">No submissions yet.</p>'}
async function saveProgress(id){const status=$(`status-${id}`).value,url=$(`url-${id}`).value.trim(),note=$(`note-${id}`).value.trim();if(url&&!/^https?:\/\//i.test(url))return toast('Submission URL must start with http:// or https://');if(status==='submitted'&&!url&&!tasks.find(t=>t.id===id)?.submission_name)return toast('Add a project URL or upload a ZIP before submitting.');await api(`/work/tasks/${id}`,body('PATCH',{status,submission_url:url,submission_note:note}));await loadAll();render();toast('Progress saved')}
async function reviewTask(id){const status=$(`reviewstatus-${id}`).value,feedback=$(`feedback-${id}`).value.trim();await api(`/work/tasks/${id}`,body('PATCH',{status,feedback}));await loadAll();render();toast('Review saved and employee notified')}
async function uploadZip(id){const f=$(`zip-${id}`).files[0];if(!f)return toast('Choose a ZIP file first');if(!fileSizeOk(f))return toast('ZIP must be 50 MB or smaller');if(!f.name.toLowerCase().endsWith('.zip'))return toast('Choose a .zip file');const fd=new FormData();fd.append('file',f);fd.append('note',$(`note-${id}`)?.value||'');await api(`/work/tasks/${id}/upload`,{method:'POST',body:fd});await loadAll();render();toast('Project ZIP submitted; manager notified')}
async function download(path,name){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.detail||`Download failed (${r.status})`)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function createView(){if(!people.length){$('content').innerHTML='<div class="empty">Add an employee from Team before assigning work.</div><button data-action="go" data-view="team">Open Team</button>';return}$('content').innerHTML=`<div class="columns"><section class="panel"><h2>New assignment</h2><p class="muted">Set a clear outcome, a responsible person, and a realistic deadline.</p><form id="taskForm"><label>Task title</label><input name="title" required maxlength="240" placeholder="e.g. Prepare client sales proposal"><label>Assign to</label><select name="assignee_id" required>${people.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.email)}</option>`).join('')}</select><div class="formgrid"><div><label>Priority</label><select name="priority"><option value="normal">Normal</option><option value="low">Low</option><option value="high">High</option><option value="critical">Critical</option></select></div><div><label>Deadline</label><input name="deadline" type="datetime-local"></div></div><label>Instructions / expected result</label><textarea name="description" maxlength="10000" placeholder="What needs to be done? What does complete look like?"></textarea><label>Reference URL (optional)</label><input name="reference_url" type="url" placeholder="https://…"><label>Attach reference file (optional, max 50 MB)</label><input name="attachment" type="file"><button type="submit">Assign task</button><div id="taskFormError" class="error"></div></form></section><section class="panel"><h2>Assignment checklist</h2><p>✓ Make the outcome clear</p><p>✓ Choose the employee responsible</p><p>✓ Set the priority and due date</p><p>✓ Add reference material</p><p>✓ Review the submitted work and leave feedback</p></section></div>`;$('taskForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),file=fd.get('attachment'),d=Object.fromEntries(fd);delete d.attachment;d.assignee_id=Number(d.assignee_id);if(d.deadline)d.deadline=new Date(d.deadline).toISOString();try{const t=await api('/work/tasks',body('POST',d));if(file&&file.size){if(!fileSizeOk(file))throw Error('Reference file must be 50 MB or smaller');const af=new FormData();af.append('file',file);await api(`/work/tasks/${t.id}/attachment`,{method:'POST',body:af})}await loadAll();go('tasks');toast('Task assigned successfully')}catch(err){$('taskFormError').textContent=err.message}}}
function messageCard(m){const acknowledged=m.acknowledged?'<span class="pill approved">Acknowledged</span>':'';return `<div class="message"><div class="tasktop"><h4>${esc(m.title)}</h4><div>${pill(m.kind)} ${acknowledged}</div></div><p>${esc(m.body)}</p><div class="tiny">From ${esc(m.sender)} · ${esc(dateText(m.created))}${m.meeting_at?' · Meeting: '+esc(dateText(m.meeting_at)):''}${m.recipient?' · To '+esc(m.recipient):''}</div>${!isManager()&&m.ack_required&&!m.acknowledged?`<button class="secondary smallbtn" data-action="ack-message" data-id="${m.id}">Acknowledge</button>`:''}${isManager()&&m.ack_required?`<button class="secondary smallbtn" data-action="ack-status" data-id="${m.id}">Acknowledgements (${m.ack_count||0})</button><div id="ack-${m.id}"></div>`:''}</div>`}
function messagesView(){$('content').innerHTML=`${isManager()?`<section class="panel"><h2>Send message / meeting notice</h2><p class="muted">Admin accounts cannot send work messages. Direct messages go to one employee; leaving recipient as everyone sends to the whole employee team.</p><form id="msgForm"><div class="formgrid"><div><label>Type</label><select name="kind"><option value="message">Direct message</option><option value="meeting">Meeting notice</option><option value="announcement">Team announcement</option></select></div><div><label>Recipient</label><select name="recipient_id"><option value="">Everyone</option>${people.map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.email)}</option>`).join('')}</select></div></div><label>Subject</label><input name="title" required maxlength="240" placeholder="e.g. Team meeting today at 3 PM"><div id="meetingTimeField" hidden><label>Scheduled meeting date &amp; time</label><input id="meetingAt" name="meeting_at" type="datetime-local"></div><label>Message / meeting details</label><textarea name="body" required maxlength="10000" placeholder="Include date, time, location or meeting link…"></textarea><label><input style="width:auto" type="checkbox" name="require_ack" value="true"> Request acknowledgement</label><button type="submit">Send message</button><div id="msgError" class="error"></div></form></section>`:''}<div class="sectionhead"><h2>Inbox & announcements</h2><button class="secondary smallbtn" data-action="refresh">Refresh inbox</button></div><section class="panel">${messages.map(messageCard).join('')||'<div class="empty">No messages or meeting notices yet.</div>'}</section>`;if(isManager()){const form=$('msgForm');form.elements.kind.addEventListener('change',()=>{const isMeeting=form.elements.kind.value==='meeting';$('meetingTimeField').hidden=!isMeeting;$('meetingAt').required=isMeeting});form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.recipient_id=d.recipient_id?Number(d.recipient_id):null;d.meeting_at=d.meeting_at?new Date(d.meeting_at).toISOString():'';try{await api('/work/messages',body('POST',d));await loadAll();render();toast('Message sent')}catch(err){$('msgError').textContent=err.message}}}}
function notificationsView(){$('content').innerHTML=`<div class="toolbar"><button data-action="read-all">Mark all read</button><button class="secondary" data-action="refresh">Refresh notifications</button></div><section class="panel" style="margin-top:12px">${notifications.map(n=>`<div class="message ${n.read?'':'unread'}"><div class="tasktop"><h4>${esc(n.title)}</h4><span class="pill">${n.read?'Read':'Unread'}</span></div><p>${esc(n.body)}</p><div class="tiny">${esc(n.kind)} · ${esc(dateText(n.created))}</div><div class="toolbar">${n.task_id?`<button class="secondary smallbtn" data-action="open-task" data-id="${n.task_id}">Open task #${n.task_id}</button>`:''}${!n.read?`<button class="secondary smallbtn" data-action="read-notification" data-id="${n.id}">Mark read</button>`:''}</div></div>`).join('')||'<div class="empty">No notifications yet.</div>'}</section>`}
function calendarView(){$('content').innerHTML=`<section class="panel"><h2>Upcoming deadlines & meetings</h2><p class="muted">Task deadlines are shown by due date. Meeting notices appear by the time they were sent; check the message body for the scheduled meeting time.</p>${calendarItems.map(x=>`<div class="event"><b>${esc(x.title)}</b><div>${esc(dateText(x.deadline||x.created))} ${pill(x.kind||x.status||'event')}</div><div class="muted">${x.assignee_name?'Assigned to '+esc(x.assignee_name):''}</div>${x.task_id?`<button class="secondary smallbtn" data-action="open-task" data-id="${x.task_id}">Open task</button>`:''}</div>`).join('')||'<div class="empty">No deadlines or meetings yet.</div>'}</section>`}
function reportsView(){$('content').innerHTML=`<div class="grid">${stat('Total tasks',reports.total||0)}${stat('Overdue',reports.overdue||0)}${stat('Awaiting review',reports.awaiting_review||0)}${stat('Approved',(reports.status_counts||{}).approved||0)}</div><section class="panel" style="margin-top:16px"><h2>Status breakdown</h2><div class="tablewrap"><table><thead><tr><th>Status</th><th>Tasks</th></tr></thead><tbody>${Object.entries(reports.status_counts||{}).map(([k,v])=>`<tr><td>${esc(k.replaceAll('_',' '))}</td><td>${v}</td></tr>`).join('')}</tbody></table></div>${isManager()?`<h2 style="margin-top:24px">Employee workload</h2><div class="tablewrap"><table><thead><tr><th>Employee</th><th>Total</th><th>Approved</th><th>Awaiting review</th><th>Overdue</th></tr></thead><tbody>${(reports.by_employee||[]).map(x=>`<tr><td>${esc(x.employee)}</td><td>${x.total}</td><td>${x.approved}</td><td>${x.submitted}</td><td>${x.overdue}</td></tr>`).join('')||'<tr><td colspan="5">No assigned work yet.</td></tr>'}</tbody></table></div>`:''}<button data-action="export-report">Export report CSV</button></section>`}
function teamView(){$('content').innerHTML=`<section class="panel"><h2>Add employee</h2><p class="muted">Managers can create employee accounts and deactivate team members. Copy the temporary password when it is shown.</p><form id="personForm" class="formgrid"><div><label>Full name</label><input name="name" required maxlength="200"></div><div><label>Work email</label><input name="email" type="email" required></div><div><label>Department</label><input name="department" maxlength="120"></div><div style="display:flex;align-items:end"><button type="submit">Add employee</button></div></form><div id="personError" class="error"></div><div id="tempPass"></div></section><section class="panel" style="margin-top:14px"><h2>Active employees (${people.length})</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Action</th></tr></thead><tbody>${people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.department)}</td><td><button class="danger smallbtn" data-action="remove-person" data-id="${p.id}" data-name="${esc(p.name)}">Deactivate</button></td></tr>`).join('')||'<tr><td colspan="4">No employees found.</td></tr>'}</tbody></table></div></section>`;$('personForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{const r=await api('/work/people',body('POST',{...d,role_id:0}));$('tempPass').innerHTML=`<div class="notice">Created ${esc(r.name)}. Temporary password: <b>${esc(r.temp_password)}</b><br>Copy this password now and share it securely. It will not be shown again.</div>`;await loadAll();render();toast('Employee added')}catch(err){$('personError').textContent=err.message}}}
function searchView(){$('content').innerHTML=`<section class="panel"><form id="searchForm"><label>Search all authorized work</label><div class="toolbar"><input name="q" required value="${esc(query)}" placeholder="Task, employee, message…"><button>Search</button></div></form><div id="searchResults"></div></section>`;if(query)runSearch(query);$('searchForm').onsubmit=e=>{e.preventDefault();query=new FormData(e.target).get('q').trim();runSearch(query)}}
async function runSearch(q){const holder=$('searchResults');if(!holder)return;holder.innerHTML='<p class="muted">Searching…</p>';try{const d=await api('/work/search?q='+encodeURIComponent(q));holder.innerHTML=`<h3>Tasks (${d.tasks.length})</h3>${d.tasks.map(t=>`<div class="event"><b>#${t.id} ${esc(t.title)}</b>${pill(t.status)} <span>${esc(t.assignee_name)}</span><p>${esc(t.description)}</p><button class="secondary smallbtn" data-action="open-task" data-id="${t.id}">Open task</button></div>`).join('')||'<p class="muted">No matching tasks.</p>'}<h3>Messages (${d.messages.length})</h3>${d.messages.map(m=>`<div class="event"><b>${esc(m.title)}</b><p>${esc(m.body)}</p><span class="tiny">${esc(dateText(m.created))}</span></div>`).join('')||'<p class="muted">No matching messages.</p>'}${isManager()?`<h3>People (${d.people.length})</h3>${d.people.map(p=>`<div class="event"><b>${esc(p.name)}</b> · ${esc(p.email)} · ${esc(p.department)}</div>`).join('')||'<p class="muted">No matching employees.</p>'}`:''}`}catch(e){holder.innerHTML=`<p class="error">${esc(e.message)}</p>`}}
function exportReport(){const rows=[['Task ID','Title','Employee','Priority','Deadline','Status','Manager','Submission URL'],...tasks.map(t=>[t.id,t.title,t.assignee_name,t.priority,t.deadline,t.status,t.manager_name,t.submission_url])];const csv=rows.map(row=>row.map(v=>{const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='bizsuite-task-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=Number(b.dataset.id);try{switch(action){case'go':go(b.dataset.view);break;case'refresh':await loadAll();render();toast('Workspace refreshed');break;case'clear-filters':query='';tasksView();break;case'toggle-detail':{const box=$(`detail-${id}`);box.hidden=!box.hidden;if(!box.hidden)await loadTaskDetails(id);break}case'save-progress':await saveProgress(id);break;case'review-task':await reviewTask(id);break;case'upload-zip':await uploadZip(id);break;case'download-attachment':await download(`/work/tasks/${id}/attachment`,`task-${id}-reference`);break;case'download-zip':await download(`/work/tasks/${id}/download`,`task-${id}-submission.zip`);break;case'download-version':await download(`/work/tasks/${id}/submissions/${b.dataset.version}/download`,`task-${id}-version.zip`);break;case'ack-message':await api(`/work/messages/${id}/ack`,{method:'POST'});await loadAll();render();toast('Message acknowledged');break;case'ack-status':{const d=await api(`/work/messages/${id}/acknowledgements`);const holder=$(`ack-${id}`);if(holder)holder.innerHTML=`<div class="notice">Acknowledged ${d.acknowledged} of ${d.total} recipient(s). ${d.people.map(p=>`<div>${esc(p.name)} — ${p.acknowledged_at?'Acknowledged '+esc(dateText(p.acknowledged_at)):'Not yet acknowledged'}</div>`).join('')}</div>`;break;}case'read-notification':await api(`/work/notifications/${id}/read`,{method:'PATCH'});await loadAll();render();break;case'read-all':await api('/work/notifications/read-all',{method:'POST'});await loadAll();render();toast('Notifications marked read');break;case'open-task':await loadAll();go('tasks');setTimeout(()=>{const card=$(`task-${id}`);if(card){card.scrollIntoView({behavior:'smooth',block:'center'});const detail=$(`detail-${id}`);if(detail){detail.hidden=false;loadTaskDetails(id)}}},50);break;case'remove-person':if(confirm(`Deactivate ${b.dataset.name}? They will no longer be able to sign in.`)){await api(`/work/people/${id}`,{method:'DELETE'});await loadAll();render();toast('Employee deactivated')}break;case'export-report':exportReport();break;case'search':go('search');break;case'edit-task':await editTask(id);break;default:toast('This action is not available.')}}catch(err){toast(err.message||'Action failed')}}
async function editTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;const title=prompt('Task title:',t.title);if(title===null)return;if(!title.trim())return toast('Title cannot be blank');const description=prompt('Task instructions:',t.description||'');if(description===null)return;const priority=prompt('Priority: low, normal, high, critical',t.priority);if(priority===null)return;const p=priority.trim().toLowerCase();if(!['low','normal','high','critical'].includes(p))return toast('Invalid priority');const deadline=prompt('Deadline (ISO date/time, or blank):',t.deadline||'');if(deadline===null)return;const reference_url=prompt('Reference URL, or blank:',t.reference_url||'');if(reference_url===null)return;if(reference_url&&!/^https?:\/\//i.test(reference_url))return toast('Reference URL must begin with http:// or https://');await api(`/work/tasks/${id}`,body('PATCH',{title:title.trim(),description,priority:p,deadline,reference_url}));await loadAll();render();toast('Task updated')}
$('loginForm').addEventListener('submit',loginSubmit);$('logout').addEventListener('click',()=>logout());$('refresh').addEventListener('click',async()=>{try{await loadAll();render();toast('Workspace refreshed')}catch(e){toast(e.message)}});$('searchBtn').addEventListener('click',()=>go('search'));document.addEventListener('click',handleClick);document.addEventListener('submit',async e=>{const f=e.target.closest('[data-form="comment"]');if(!f)return;e.preventDefault();const id=Number(f.dataset.id),txt=new FormData(f).get('body').trim();if(!txt)return;try{await api(`/work/tasks/${id}/comments`,body('POST',{body:txt}));f.reset();await loadTaskDetails(id);await loadAll();toast('Comment added')}catch(err){toast(err.message)}});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){query=e.target.value;const pos=e.target.selectionStart;tasksView();const n=$('taskSearch');n.focus();n.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(['statusFilter','priorityFilter'].includes(e.target.id))tasksView()});
if(token)boot();
// Shared-server sync: refresh tasks, messages and notifications automatically.
// Skip rendering while the user is editing a field to avoid losing unsaved input.
setInterval(async()=>{
  if(!token || document.visibilityState!=='visible') return;
  const active=document.activeElement;
  if(active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
  try {
    const before=JSON.stringify({tasks,messages,notifications,reports,calendarItems,people});
    await loadAll();
    const after=JSON.stringify({tasks,messages,notifications,reports,calendarItems,people});
    if(before===after) return; // Do not redraw the screen if nothing changed.
    const content=$('content');
    const hasUnsubmittedText=content && [...content.querySelectorAll('input,textarea')].some(el=>el.type!=='file' && el.value && el.value!==el.defaultValue);
    if(!hasUnsubmittedText) {
      const expanded=[...document.querySelectorAll('[id^="detail-"]')].filter(el=>!el.hidden).map(el=>el.id);
      const scroll=window.scrollY;
      render();
      for(const id of expanded){const box=$(id);if(box){box.hidden=false;try{await loadTaskDetails(Number(id.slice(7)))}catch{}}}
      window.scrollTo(0,scroll);
    }
  } catch(e) { /* Retry silently on the next interval; manual Refresh shows detailed errors. */ }
},15000);
</script></body></html>
