services:
  - type: web
    name: bizsuite-api
    rootDir: BizSuite_CLOUD_MYSQL_RENDER_SETUP/BizSuite_Professional_Desktop
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_SSL_CA_BASE64
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRUST_PROXY
        value: "true"
