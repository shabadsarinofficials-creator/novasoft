# BizSuite by NovaSoft — single-service Render Blueprint
# One web service runs the built-in uvicorn server (API + HTML UI).
# No separate frontend host, Node server, or nginx required.

services:
  - type: web
    name: bizsuite
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: bizsuite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        value: admin@novasoft.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: BizSuite
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: bizsuite-db
    plan: free
    databaseName: bizsuite
    user: bizsuite
